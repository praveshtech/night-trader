<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Night Trader — Elite Prop Firm Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* --- ELITE FINANCIAL PSYCHOLOGY COLOR SYSTEM --- */
:root {
  --bg-base: #030712;       
  --bg-surface: rgba(15, 23, 42, 0.65); 
  --bg-surface-light: rgba(30, 41, 59, 0.8);
  --border-dim: rgba(255, 255, 255, 0.04);
  --border-glow: rgba(56, 189, 248, 0.2);
  --accent-gold: #F59E0B;   
  --accent-gold-glow: rgba(245, 158, 11, 0.2);
  --accent-cyan: #38BDF8;   
  --accent-purple: #818CF8; 
  --accent-discord: #5865F2;
  --status-success: #10B981;
  --status-success-dim: rgba(16, 185, 129, 0.1);
  --status-warn: #F59E0B;
  --status-danger: #EF4444;
  --text-main: #F8FAFC;     
  --text-muted: #94A3B8;
  
  --font-head: 'Space Grotesk', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 12px;
  --radius-lg: 20px;
}
.logo-image { height: 50px; width: auto; object-fit: contain; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background-color: var(--bg-base); color: var(--text-main);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6; min-height: 100vh; overflow-x: hidden;
  background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.03) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 40%);
  background-attachment: fixed;
}

/* --- TEXT & CARD ANIMATIONS --- */
@keyframes glowPulse { 0% { box-shadow: 0 0 10px var(--accent-gold-glow); } 50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); } 100% { box-shadow: 0 0 10px var(--accent-gold-glow); } }
@keyframes textGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
@keyframes borderFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* --- INFINITE MARQUEE BANNER --- */
.marquee-container { width: 100%; overflow: hidden; background: rgba(10, 15, 28, 0.98); border-bottom: 1px solid var(--border-dim); padding: 8px 0; white-space: nowrap; position: fixed; top: 70px; left: 0; z-index: 98; display: flex; backdrop-filter: blur(10px); }
.marquee-content { display: inline-flex; animation: marquee-scroll 25s linear infinite; }
.marquee-container:hover .marquee-content { animation-play-state: paused; }
.marquee-item { display: inline-flex; align-items: center; gap: 10px; padding: 0 30px; font-family: var(--font-head); font-size: 13px; font-weight: 600; color: var(--text-main); }
.marquee-logo { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: #fff; }
.marquee-badge.trusted { background: rgba(16, 185, 129, 0.15); color: var(--status-success); border: 1px solid rgba(16, 185, 129, 0.3); padding: 2px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.marquee-badge.code { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); padding: 2px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; }
.marquee-badge.code:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
.marquee-separator { color: var(--text-muted); opacity: 0.5; margin: 0 10px; }
@keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

/* --- ORBIT ANIMATIONS --- */
.bg-orbit-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 1200px; height: 800px; z-index: 0; pointer-events: none; overflow: hidden; }
.orbit-icon { position: absolute; top: 50%; left: 50%; max-width: 140px; max-height: 140px; object-fit: contain; filter: grayscale(100%) opacity(0.12) drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
.orbit-1 { animation: orbitCW1 35s linear infinite; width: 120px; margin-top: -60px; margin-left: -60px; }
.orbit-2 { animation: orbitCCW1 45s linear infinite; width: 100px; margin-top: -50px; margin-left: -50px; }
.orbit-3 { animation: orbitCW2 25s linear infinite; width: 140px; margin-top: -70px; margin-left: -70px; }
.orbit-4 { animation: orbitCCW2 40s linear infinite; width: 110px; margin-top: -55px; margin-left: -55px; }
.orbit-5 { animation: orbitCW3 30s linear infinite; width: 130px; margin-top: -65px; margin-left: -65px; border-radius: 20px; }
@keyframes orbitCW1 { 0% { transform: rotate(0deg) translateX(350px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(350px) rotate(-360deg); } }
@keyframes orbitCCW1 { 0% { transform: rotate(360deg) translateX(450px) rotate(-360deg); } 100% { transform: rotate(0deg) translateX(450px) rotate(0deg); } }
@keyframes orbitCW2 { 0% { transform: rotate(120deg) translateX(280px) rotate(-120deg); } 100% { transform: rotate(480deg) translateX(280px) rotate(-480deg); } }
@keyframes orbitCCW2 { 0% { transform: rotate(240deg) translateX(400px) rotate(-240deg); } 100% { transform: rotate(-120deg) translateX(400px) rotate(120deg); } }
@keyframes orbitCW3 { 0% { transform: rotate(70deg) translateX(520px) rotate(-70deg); } 100% { transform: rotate(430deg) translateX(520px) rotate(-430deg); } }

.highlight-cyan { color: var(--accent-cyan); font-weight: 600; }
.highlight-gold { color: var(--accent-gold); font-weight: 700; }
.highlight-success { color: var(--status-success); font-weight: 600; }

/* --- NAV --- */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border-dim); padding: 0 4%; height: 70px; display: flex; align-items: center; justify-content: space-between; }
.logo { text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo-text { font-family: var(--font-head); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-main); }
.nav-links { display: flex; gap: 8px; list-style: none; }
.nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; font-family: var(--font-head); text-transform: uppercase; }
.nav-links a:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
.nav-actions { display: flex; align-items: center; gap: 16px; }
.icon-btn { color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: color 0.2s; cursor: pointer; }
.icon-btn:hover { color: var(--text-main); }
.mobile-menu-btn { display: none; } 
.desktop-cta { background: linear-gradient(135deg, var(--accent-gold), #D97706); color: #000; font-weight: 700; padding: 8px 18px; border-radius: 8px; font-size: 13px; text-decoration: none; font-family: var(--font-head); text-transform: uppercase; box-shadow: 0 4px 15px var(--accent-gold-glow); animation: glowPulse 3s infinite; }

/* --- SIDE DRAWER --- */
.mobile-drawer { position: fixed; top: 0; right: -320px; width: 300px; height: 100vh; background: rgba(3, 7, 18, 0.98); backdrop-filter: blur(24px); border-left: 1px solid var(--border-dim); z-index: 9999; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 30px 24px; box-shadow: -10px 0 40px rgba(0,0,0,0.8); }
.mobile-drawer.open { right: 0; }
.drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9998; opacity: 0; visibility: hidden; transition: 0.3s; }
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-dim); padding-bottom: 20px;}
.drawer-title { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--text-main); }
.close-drawer-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.close-drawer-btn:hover { color: #fff; background: var(--status-danger); border-color: var(--status-danger); }
.drawer-links { display: flex; flex-direction: column; gap: 16px; }
.drawer-link { display: flex; align-items: center; gap: 14px; color: var(--text-main); text-decoration: none; font-family: var(--font-head); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-dim); transition: 0.3s; }
.drawer-link:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); color: var(--accent-cyan); transform: translateX(5px); }
.drawer-link svg { color: var(--accent-cyan); }

/* --- HERO SECTION --- */
.hero { position: relative; padding: 220px 4% 80px; text-align: center; overflow: hidden; } 
.hero-content { position: relative; z-index: 2; max-width: 1000px; margin: 0 auto; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--status-success-dim); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--status-success); font-size: 12px; font-weight: 700; font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; padding: 6px 16px; border-radius: 100px; margin-bottom: 24px; animation: slideUpFade 0.6s ease-out both; }
.hero-badge::before { content: ''; width: 6px; height: 6px; background: var(--status-success); border-radius: 50%; box-shadow: 0 0 8px var(--status-success); }
h1 { font-family: var(--font-head); font-size: clamp(36px, 6vw, 72px); font-weight: 700; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 24px; animation: slideUpFade 0.8s ease-out 0.1s both; }
.h1-accent { background: linear-gradient(to right, #fff, var(--accent-cyan), var(--accent-purple), #fff); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textGradient 6s linear infinite; }
.hero-sub { color: var(--text-muted); font-size: clamp(15px, 2vw, 19px); max-width: 680px; margin: 0 auto 30px; line-height: 1.7; animation: slideUpFade 1s ease-out 0.2s both; }

/* INSTANT SEARCH BAR */
.search-container { position: relative; max-width: 500px; margin: 0 auto 30px; animation: slideUpFade 1.1s ease-out 0.25s both; }
.search-container input { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-glow); border-radius: 100px; padding: 16px 20px 16px 54px; color: #fff; font-size: 16px; font-family: var(--font-body); outline: none; transition: 0.3s; box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); backdrop-filter: blur(10px); }
.search-container input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); }
.search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--accent-cyan); pointer-events: none; }

.hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 60px; animation: slideUpFade 1.2s ease-out 0.3s both; }
.btn-primary { background: linear-gradient(135deg, var(--accent-cyan), #0284c7); color: #000; border: none; padding: 15px 36px; border-radius: 12px; font-family: var(--font-head); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4); }
.btn-primary:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 30px rgba(56, 189, 248, 0.6); }
.btn-secondary { background: rgba(255,255,255,0.02); color: var(--text-main); border: 1px solid var(--border-dim); padding: 15px 36px; border-radius: 12px; font-family: var(--font-head); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); }
.btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(255,255,255,0.05); }

/* TRUST STAT GRID */
.trust-stats-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; animation: slideUpFade 1.4s ease-out 0.4s both; }
.stat-box { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-dim); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.3s; }
.stat-box:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.1); }
.stat-icon { color: var(--accent-purple); margin-bottom: 8px; }
.stat-num { font-family: var(--font-head); font-size: 32px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
.stat-text { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

/* --- PROPFIRMMATCH STYLE ADVANCED FILTER ENGINE --- */
.filter-bar-wrapper { position: sticky; top: 107px; z-index: 90; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-dim); display: flex; flex-direction: column; }
.filter-bar-main { padding: 16px 4%; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.filter-bar-main::-webkit-scrollbar { display: none; }
.filter-tabs-group { display: flex; gap: 8px; align-items: center; }
.filter-label { font-family: var(--font-head); font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; margin-right: 8px;}
.filter-tab { padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-dim); background: transparent; color: var(--text-muted); transition: all 0.2s; font-family: var(--font-body); white-space: nowrap; }
.filter-tab.active, .filter-tab:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }

.btn-advanced-toggle { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); color: var(--text-main); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; font-family: var(--font-head); text-transform: uppercase; letter-spacing: 1px;}
.btn-advanced-toggle:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); color: var(--accent-cyan); }
.btn-advanced-toggle svg { transition: 0.3s; }
.btn-advanced-toggle.open svg { transform: rotate(180deg); }

.advanced-filters-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid transparent; }
.advanced-filters-panel.open { max-height: 500px; border-bottom: 1px solid var(--border-dim); }
.advanced-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; padding: 20px 4%; }
.adv-filter-group { display: flex; flex-direction: column; gap: 8px; }
.adv-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.adv-select { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-dim); border-radius: 8px; color: #fff; font-family: var(--font-body); font-size: 13px; outline: none; cursor: pointer; appearance: none; transition: 0.3s;}
.adv-select:focus { border-color: var(--accent-cyan); }
.checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.checkbox-group input { width: 16px; height: 16px; accent-color: var(--accent-cyan); cursor: pointer; }
.checkbox-group span { font-size: 13px; color: var(--text-main); font-weight: 500; }

/* --- SECTION HEADERS --- */
section { padding: 60px 4%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
.section-title { font-family: var(--font-head); font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.section-title span { color: var(--text-muted); font-weight: 400; font-size: 15px; margin-left: 8px; font-family: var(--font-body); }
.live-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--status-success); font-family: var(--font-mono); background: rgba(16, 185, 129, 0.1); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.2); white-space: nowrap;}
.pulse-dot { width: 8px; height: 8px; background-color: var(--status-success); border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 2s infinite; }

/* --- ELITE FIRM CARDS --- */
.firms-grid { display: flex; flex-direction: column; gap: 16px; }
.firm-card { background: var(--bg-surface); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); padding: 24px 30px; display: grid; grid-template-columns: 30px 1.5fr auto auto auto auto; align-items: center; gap: 24px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(16px); position: relative; overflow: visible; text-decoration: none; color: inherit; }
.firm-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 255, 255, 0.02); z-index: 10; }
.firm-card::before { content: ''; position: absolute; bottom: 0; left: 0; height: 2px; width: 0%; background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent); transition: width 0.6s ease; }
.firm-card:hover::before { width: 100%; }
.firm-card.hidden { display: none !important; }

/* Compare Checkbox */
.compare-checkbox-wrapper { display: flex; align-items: center; justify-content: center; }
.custom-checkbox { position: relative; display: inline-flex; cursor: pointer; }
.custom-checkbox input { display: none; }
.checkmark { width: 22px; height: 22px; border: 2px solid var(--border-dim); border-radius: 6px; background: rgba(0,0,0,0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.custom-checkbox input:checked ~ .checkmark { background: var(--accent-cyan); border-color: var(--accent-cyan); }
.custom-checkbox input:checked ~ .checkmark::after { content: '✓'; color: #000; font-size: 14px; font-weight: bold; }

.firm-rank { font-family: var(--font-mono); font-size: 15px; color: var(--text-muted); text-align: center; font-weight: 600; }
.firm-rank.top { color: var(--accent-gold); font-weight: 700; font-size: 18px; text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }

.firm-logo-img { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; background: #080C14; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
.firm-logo-img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.fallback-logo { font-family: var(--font-head); font-weight: 700; font-size: 16px; color: #fff; }
.firm-inner { display: flex; align-items: center; gap: 20px; min-width: 0; }
.firm-name { font-family: var(--font-head); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.firm-tag { font-size: 10px; font-weight: 800; font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
.tag-gold { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.4); box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
.tag-cyan { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
.firm-meta { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-weight: 500; }
.pricing-engine { display: flex; flex-direction: column; gap: 8px; }
.account-size-select { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border-dim); padding: 6px 10px; border-radius: 8px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; outline: none; transition: 0.3s; }
.account-size-select:focus { border-color: var(--accent-cyan); }
.account-size-select option { background: var(--bg-surface-light); color: var(--text-main); }
.price-display { display: flex; align-items: baseline; gap: 8px; }
.old-price { font-size: 13px; color: var(--text-muted); text-decoration: line-through; }
.new-price { font-size: 18px; font-weight: 700; color: var(--accent-gold); font-family: var(--font-head); }

.trust-score { position: absolute; top: 24px; right: 30px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.trust-num { font-family: var(--font-head); font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-bottom: 4px; }
.trust-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

.discount-wrap { text-align: center; }
.discount-pill { background: rgba(255,255,255,0.03); border: 1px dashed var(--accent-gold); color: var(--accent-gold); font-family: var(--font-mono); font-size: 15px; font-weight: 700; padding: 8px 18px; border-radius: 10px; letter-spacing: 1px; transition: 0.3s; }
.firm-card:hover .discount-pill { background: rgba(245, 158, 11, 0.05); box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.1); }
.discount-off { font-size: 11px; font-weight: 700; color: var(--accent-gold); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px;}

.btn-get { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-dim); padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: var(--font-head); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; }
.firm-card:hover .btn-get { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }

/* Premium Featured Card */
.firm-card.featured { background: linear-gradient(var(--bg-surface), var(--bg-surface)) padding-box, linear-gradient(135deg, var(--accent-gold), transparent, var(--accent-cyan)) border-box; border: 1px solid transparent; background-size: 200% 200%; animation: borderFlow 5s linear infinite; }
.firm-card.featured:hover { transform: translateY(-4px); box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(245, 158, 11, 0.05); }
.firm-card.featured::after { content: '★ INSTITUTIONAL PICK'; position: absolute; top: -1px; left: 60px; background: var(--accent-gold); color: #000; font-size: 10px; font-weight: 800; font-family: var(--font-head); letter-spacing: 1px; padding: 4px 14px; border-radius: 0 0 8px 8px; pointer-events: auto; }

/* ACCORDION METRICS & SPLIT CALCULATOR */
.metrics-row { grid-column: 1 / -1; width: 100%; margin-top: 10px; }
.toggle-metrics-btn { width: 100%; padding: 12px; border: none; border-top: 1px dashed var(--border-dim); background: transparent; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; outline: none; }
.toggle-metrics-btn:hover { color: var(--accent-cyan); background: rgba(255,255,255,0.01); }
.toggle-metrics-btn svg { transition: transform 0.3s; }
.toggle-metrics-btn.active svg { transform: rotate(180deg); }
.metrics-dropdown { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0, 1, 0, 1); }
.metrics-dropdown.open { max-height: 800px; transition: max-height 0.8s ease-in-out; }
.metrics-grid-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px 20px; background: rgba(3, 7, 18, 0.4); border: 1px solid rgba(255,255,255,0.03); border-radius: 12px 12px 0 0; margin-top: 8px; }
.metric-item { display: flex; flex-direction: column; gap: 4px; }
.metric-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.metric-value { font-size: 13px; font-weight: 700; color: var(--text-main); font-family: var(--font-mono); }
.metric-value.good { color: var(--status-success); }
.metric-value.warn { color: var(--status-warn); }

.split-calc-container { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.03); border-top: none; border-radius: 0 0 12px 12px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px;}
.split-calc-header { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.split-calc-inputs { display: flex; align-items: center; gap: 16px; flex: 1; }
.split-calc-inputs input { background: rgba(0,0,0,0.5); border: 1px solid var(--border-dim); border-radius: 8px; padding: 10px 14px; color: #fff; font-family: var(--font-mono); font-size: 14px; outline: none; width: 150px; transition: 0.3s; }
.split-calc-inputs input:focus { border-color: var(--status-success); }
.split-results { display: flex; gap: 20px; font-size: 13px; font-weight: 600; }
.trader-share-label { color: var(--text-muted); }
.trader-share { color: var(--status-success); font-family: var(--font-mono); font-size: 15px; margin-left: 6px;}
.firm-share-label { color: var(--text-muted); }
.firm-share { color: var(--status-warn); font-family: var(--font-mono); font-size: 15px; margin-left: 6px;}

/* --- STICKY COMPARE TRAY & MODAL --- */
.compare-tray { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.98); border-top: 1px solid var(--accent-cyan); padding: 16px 4%; display: flex; justify-content: space-between; align-items: center; z-index: 999; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(15px); box-shadow: 0 -10px 30px rgba(0,0,0,0.6); }
.compare-tray.show { transform: translateY(0); }
.compare-tray-info { font-family: var(--font-head); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 12px; }
.compare-tray-count { background: var(--accent-cyan); color: #000; padding: 2px 10px; border-radius: 10px; font-size: 14px; }
.compare-tray-actions { display: flex; gap: 12px; }
.btn-compare-clear { background: transparent; border: 1px solid var(--border-dim); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600;}
.btn-compare-clear:hover { color: #fff; background: rgba(255,255,255,0.05); }

.compare-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(10px); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; padding: 20px; }
.compare-modal-overlay.active { opacity: 1; visibility: visible; }
.compare-modal { background: var(--bg-surface); border: 1px solid var(--border-dim); border-radius: var(--radius-lg); width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); transition: 0.4s; }
.compare-modal-overlay.active .compare-modal { transform: translateY(0); }
.compare-header { padding: 20px 30px; border-bottom: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center; }
.compare-header h2 { font-family: var(--font-head); font-size: 22px; }
.compare-body { padding: 0; overflow-y: auto; overflow-x: auto; }
.compare-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
.compare-table th, .compare-table td { padding: 16px 20px; border-bottom: 1px solid var(--border-dim); font-size: 14px; }
.compare-table th { background: rgba(0,0,0,0.3); font-family: var(--font-head); color: var(--text-main); font-weight: 700; white-space: nowrap;}
.compare-table td:first-child { font-weight: 600; color: var(--text-muted); background: rgba(0,0,0,0.1); border-right: 1px solid var(--border-dim); width: 180px; }

/* DRAWDOWN SIMULATOR */
.simulator-section { padding: 40px 4%; max-width: 1200px; margin: 0 auto; }
.simulator-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(3, 7, 18, 0.9)); border: 1px solid var(--accent-cyan); border-radius: var(--radius-lg); padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; box-shadow: 0 10px 40px rgba(56, 189, 248, 0.1); position: relative; overflow: hidden; }
.simulator-card::before { content:''; position: absolute; top:-50%; left:-50%; width:200%; height:200%; background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 60%); pointer-events: none; }
.sim-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; margin-bottom: 10px; }
.sim-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
.sim-input-group { margin-bottom: 20px; }
.sim-label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.sim-select { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-dim); border-radius: 8px; color: #fff; font-family: var(--font-body); font-size: 15px; outline: none; transition: 0.3s; }
.sim-select:focus { border-color: var(--accent-cyan); }
.sim-result-box { background: rgba(0,0,0,0.4); border-radius: 16px; padding: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--border-dim); transition: all 0.4s ease;}
.sim-result-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; background: rgba(255,255,255,0.05); font-size: 24px; }
.sim-result-title { font-family: var(--font-head); font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.sim-result-text { font-size: 14px; color: var(--text-muted); }
.result-safe .sim-result-icon { background: rgba(16, 185, 129, 0.2); color: var(--status-success); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
.result-safe .sim-result-title { color: var(--status-success); }
.result-risk .sim-result-icon { background: rgba(239, 68, 68, 0.2); color: var(--status-danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
.result-risk .sim-result-title { color: var(--status-danger); }

/* PAYOUT PROOF WALL */
.payout-section { padding-top: 20px; }
.masonry-grid { column-count: 3; column-gap: 20px; margin-top: 30px; }
.payout-card { break-inside: avoid; margin-bottom: 20px; background: var(--bg-surface); border: 1px solid var(--border-dim); border-radius: 16px; padding: 20px; transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden;}
.payout-card:hover { transform: translateY(-5px); border-color: rgba(56, 189, 248, 0.3); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1); }
.payout-img-placeholder { width: 100%; height: 180px; background: linear-gradient(45deg, rgba(255,255,255,0.02), rgba(255,255,255,0.05)); border-radius: 8px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.1); color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;}
.payout-info { display: flex; justify-content: space-between; align-items: flex-end; }
.payout-amt { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: var(--status-success); }
.payout-firm { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.payout-date { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

/* DISCORD COMMUNITY BANNER */
.discord-banner { background: linear-gradient(135deg, rgba(88, 101, 242, 0.15), rgba(3, 7, 18, 0.9)); border: 1px solid rgba(88, 101, 242, 0.3); border-radius: var(--radius-lg); padding: 40px; display: flex; align-items: center; justify-content: space-between; margin: 60px auto 0; max-width: 1200px; box-shadow: 0 10px 40px rgba(88, 101, 242, 0.1); }
.discord-text h3 { font-family: var(--font-head); font-size: 28px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.discord-text p { color: var(--text-muted); font-size: 15px; max-width: 600px; }
.btn-discord { background: var(--accent-discord); color: #fff; border: none; padding: 14px 30px; border-radius: 10px; font-family: var(--font-head); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); text-decoration: none; }
.btn-discord:hover { background: #4752C4; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(88, 101, 242, 0.6); }

/* QUIZ MODAL */
.quiz-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
.quiz-overlay.active { opacity: 1; visibility: visible; }
.quiz-modal { background: var(--bg-surface); border: 1px solid var(--accent-cyan); border-radius: var(--radius-lg); width: 90%; max-width: 500px; padding: 40px; position: relative; transform: translateY(20px); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(56, 189, 248, 0.05); }
.quiz-overlay.active .quiz-modal { transform: translateY(0); }
.quiz-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; transition: 0.2s; }
.quiz-close:hover { color: #fff; }
.quiz-step { display: none; text-align: center; }
.quiz-step.active { display: block; animation: slideUpFade 0.4s ease forwards; }
.quiz-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; margin-bottom: 24px; }
.quiz-options { display: flex; flex-direction: column; gap: 12px; }
.quiz-option-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); color: var(--text-main); padding: 16px; border-radius: 12px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.quiz-option-btn:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-cyan); color: var(--accent-cyan); }
.quiz-result-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 24px; margin-top: 20px; }
.quiz-match-name { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--status-success); margin: 10px 0; }

/* PREMIUM FOOTER */
.elite-footer { background: rgba(3, 7, 18, 0.95); border-top: 1px solid var(--border-dim); padding: 60px 4% 30px; margin-top: 80px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; max-width: 1200px; margin: 0 auto; }
.footer-brand p { color: var(--text-muted); font-size: 13px; margin-top: 15px; max-width: 300px; line-height: 1.8; }
.footer-col h4 { font-family: var(--font-head); color: var(--text-main); margin-bottom: 20px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 12px; }
.footer-col ul li a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-size: 14px; }
.footer-col ul li a:hover { color: var(--accent-cyan); }
.footer-bottom { max-width: 1200px; margin: 40px auto 0; padding-top: 20px; border-top: 1px solid var(--border-dim); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; gap: 10px; }

/* TOAST NOTIFICATION */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 80px); background: rgba(16, 185, 129, 0.95); backdrop-filter: blur(10px); color: #000; padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 700; font-family: var(--font-head); z-index: 3000; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); border: 1px solid rgba(255,255,255,0.2); }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

  .footer-grid { grid-template-columns: 1fr; gap: 30px; text-align: center; }
